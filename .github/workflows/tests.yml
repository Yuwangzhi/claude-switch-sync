name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
  macos-lifecycle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the native lifecycle helper
        run: xcrun swiftc -O AppLifecycle.swift -o /tmp/claude-switch-sync-lifecycle -framework AppKit
